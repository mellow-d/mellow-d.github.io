<style>
/* === Tokens === */
:root{
  --bg:#f1f4f1;--ink:#12231d;--mute:#475750;--line:#c8d2cc;--acc:#0b7a5c;--card:#f8faf8;
  --nav-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1814;--ink:#e5eee9;--mute:#97aaa2;--line:#24352e;--acc:#4fd1a5;--card:#14221d
}}
:root[data-theme="dark"]{
  --bg:#0e1814;--ink:#e5eee9;--mute:#97aaa2;--line:#24352e;--acc:#4fd1a5;--card:#14221d
}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 24px)}
*{box-sizing:border-box;margin:0}

/* === Base === */
body{background:var(--bg);color:var(--ink);font:clamp(15px,1vw + 13px,18px)/1.65 "Public Sans",system-ui,sans-serif}
a{color:var(--acc);text-decoration:none}
a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;line-height:1.15}
h1{font-size:clamp(2.4rem,8vw,4rem);letter-spacing:-.02em}
h2{font-size:clamp(1.4rem,3vw,1.8rem);margin:0 0 10px}
h3{font-size:1.15rem}
.lede{font-size:clamp(1.05rem,1.5vw,1.25rem);color:var(--mute);max-width:38em;margin:20px 0 0;line-height:1.6}

/* === Skip link === */
.skip-link{position:absolute;top:-100%;left:16px;padding:8px 12px;background:var(--acc);color:#fff;border-radius:6px;z-index:200;text-decoration:none;font-weight:500;font-size:.9rem}
.skip-link:focus{top:16px}

/* === Nav === */
nav{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;padding:0 clamp(16px,4vw,48px);height:var(--nav-h);font-weight:500;position:relative;z-index:100}
nav a{color:var(--ink);text-decoration:none;margin-left:18px;position:relative}
nav a:first-child{margin:0;font-weight:600}
nav a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:2px;background:var(--acc);transition:width .2s}
nav a:hover::after{width:100%}
.nav-wrap{position:sticky;top:0;z-index:100;background:var(--bg);transition:background .3s,box-shadow .3s}
.nav-wrap.scrolled{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
.nav-actions{display:flex;align-items:center;gap:4px}
#themeToggle{background:none;border:none;cursor:pointer;font-size:1.2rem;line-height:1;padding:4px 8px}
.nav-btn{background:none;border:none;cursor:pointer;color:var(--ink);font:inherit;padding:4px 8px;display:flex;align-items:center;gap:6px;font-size:.95rem}
@media(max-width:767px){
  nav{flex-direction:column;height:auto;padding:16px clamp(16px,4vw,48px);gap:10px}
  nav a{margin-left:12px}
}

/* === Sections === */
.section{padding:clamp(48px,8vw,100px) 0}
.section:nth-child(even){background:var(--card)}
.section-inner{max-width:1100px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}

/* === Hero === */
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.hero-text{position:relative}
.hero-text::after{
  content:'';display:block;width:80px;height:4px;margin-top:24px;border-radius:2px;
  background:linear-gradient(90deg,var(--acc),#3b82f6,var(--acc));background-size:200% 100%;
  animation:shimmer 3s ease-in-out infinite
}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero-visual{display:flex;align-items:center;justify-content:center}
.hero-visual svg{width:100%;max-width:380px;height:auto}
@media(max-width:767px){
  .hero-grid{grid-template-columns:1fr;gap:24px;text-align:center}
  .hero-text::after{margin:24px auto 0}
  .hero-visual{display:none}
}
@media(min-width:768px) and (max-width:1024px){
  .hero-grid{gap:32px}
}

/* === Stats === */
.stats{display:flex;gap:clamp(16px,3vw,40px);flex-wrap:wrap;justify-content:center;margin-top:40px}
.stat{text-align:center;min-width:100px}
.stat .big{display:block;font-family:Newsreader,Georgia,serif;font-size:clamp(1.8rem,4vw,2.6rem);color:var(--acc);font-weight:600}
.stat small{color:var(--mute);font-size:.85rem}

/* === Case study cards === */
.case-list{display:flex;flex-direction:column;gap:24px;margin-top:24px}
.case-card{
  display:grid;grid-template-columns:160px 1fr;gap:32px;align-items:center;
  text-decoration:none;color:inherit;
  border:1px solid var(--line);border-radius:16px;padding:32px;background:var(--card);
  border-left:4px solid var(--team-color,var(--acc));
  transition:transform .2s ease,box-shadow .2s ease
}
.case-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.1)}
.case-card:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.case-stat{text-align:center;padding:20px 12px;border-radius:12px;background:var(--bg)}
.case-stat .metric{display:block;font-family:Newsreader,Georgia,serif;font-size:clamp(1.6rem,3vw,2.2rem);font-weight:600;color:var(--team-color,var(--acc));line-height:1.2}
.case-stat .metric-label{display:block;font-size:.75rem;color:var(--mute);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
.case-body h3{margin-bottom:8px}
.case-body .case-short{color:var(--mute);font-size:.95rem;line-height:1.5;margin-bottom:12px}
.case-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.case-tag{font-size:.7rem;font-weight:500;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;text-transform:uppercase;letter-spacing:.02em}
.case-cta{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:500;color:var(--acc)}
.case-cta svg{width:16px;height:16px;transition:transform .2s}
.case-card:hover .case-cta svg{transform:translateX(6px)}
@media(max-width:767px){
  .case-card{grid-template-columns:1fr;gap:16px;padding:24px}
  .case-stat{display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left}
  .case-stat .metric{font-size:1.4rem}
}

/* === Reveal === */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease}
.reveal.revealed{opacity:1;transform:none}
.reveal-stagger{transition-delay:calc(var(--i,0) * .1s)}

/* === Skill pills & filter === */
.skill-filter{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.filter-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-size:.85rem;cursor:pointer;color:var(--ink);transition:all .15s;font-family:inherit}
.filter-btn:hover,.filter-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.skill-pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 16px;background:var(--card);font-size:.85rem;color:var(--mute);transition:all .2s}
.pill.hidden{display:none}
.pill:not(.hidden):hover{background:var(--acc);color:#fff;border-color:var(--acc);transform:scale(1.05)}

/* === Timeline === */
.timeline{position:relative;padding-left:24px;border-left:2px solid var(--line);margin:16px 0}
.tl-item{position:relative;padding:16px 0 16px 20px;transition:transform .2s}
.tl-item:hover{transform:translateX(4px)}
.tl-item::before{content:'';position:absolute;left:-8px;top:24px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line);transform:scale(0);transition:transform .4s ease}
.tl-item.revealed::before{transform:scale(1)}
.tl-date{font-size:.85rem;color:var(--mute);margin-bottom:4px}
.tl-content b{display:block;margin-bottom:4px;font-family:Newsreader,Georgia,serif}
.tl-content span{color:var(--mute);font-size:.95rem}

/* === Detail page === */
.detail-header{padding:clamp(40px,6vw,80px) 0 clamp(32px,4vw,48px);position:relative;overflow:hidden}
.detail-header::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--team-color) 8%,var(--bg)),var(--bg));z-index:0}
.detail-header .section-inner{position:relative;z-index:1}
.detail-header .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:500;color:var(--acc);margin-bottom:24px;font-size:.9rem}
.detail-header .back svg{width:16px;height:16px;transition:transform .2s}
.detail-header .back:hover svg{transform:translateX(-4px)}
.detail-header h1{margin-bottom:16px}
.detail-header .detail-meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:12px}
.detail-header .detail-metric{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:8px;background:color-mix(in srgb,var(--team-color) 12%,var(--card));font-weight:600;color:var(--team-color)}
.detail-header .detail-team{display:inline-block;padding:4px 12px;border-radius:6px;font-size:.8rem;font-weight:500;color:var(--team-color);border:1px solid color-mix(in srgb,var(--team-color) 30%,transparent)}
.detail-header .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.detail-header .tags span{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:2px 10px;background:var(--card);font-size:.82rem;color:var(--mute)}

.detail-layout{display:grid;grid-template-columns:200px 1fr;gap:48px;max-width:1100px;margin:0 auto;padding:clamp(32px,4vw,64px) clamp(16px,4vw,48px)}
.detail-toc{position:sticky;top:calc(var(--nav-h) + 24px);align-self:start}
.detail-toc ul{list-style:none;padding:0;border-left:2px solid var(--line)}
.detail-toc li{padding:8px 0 8px 16px;border-left:2px solid transparent;margin-left:-2px;transition:border-color .2s,color .2s}
.detail-toc li.active{border-left-color:var(--team-color,var(--acc))}
.detail-toc a{color:var(--mute);text-decoration:none;font-size:.88rem;transition:color .2s}
.detail-toc li.active a{color:var(--ink);font-weight:500}
.detail-toc a:hover{color:var(--ink)}
.detail-content h2{margin:48px 0 12px;padding-top:8px;scroll-margin-top:calc(var(--nav-h) + 32px)}
.detail-content h2:first-child{margin-top:0}
.detail-content ul{padding-left:1.2em}.detail-content li{margin:8px 0}
.detail-content p{margin:8px 0;line-height:1.7}
@media(max-width:900px){
  .detail-layout{grid-template-columns:1fr;gap:0;padding-top:24px}
  .detail-toc{display:none}
}

/* === Prev/Next nav === */
.project-nav{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:64px;padding-top:32px;border-top:1px solid var(--line)}
.project-nav a{display:block;padding:16px 20px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}
.project-nav a:hover{border-color:var(--acc);transform:translateY(-2px)}
.project-nav .nav-label{font-size:.75rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.project-nav .nav-title{font-weight:500;font-size:.95rem}
.project-nav .nav-team{font-size:.8rem;color:var(--mute);margin-top:2px}
.project-nav .next{text-align:right}
@media(max-width:600px){
  .project-nav{grid-template-columns:1fr;gap:12px}
}

/* === Footer === */
footer{background:var(--card);border-top:1px solid var(--line);padding:48px 0 32px}
.footer-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px;max-width:1100px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
.footer-col{font-size:.9rem;color:var(--mute)}
.footer-col strong{display:block;color:var(--ink);margin-bottom:4px}
.footer-col a{display:block;color:var(--acc);margin:4px 0;text-decoration:none}
.footer-col a:hover{text-decoration:underline}
.footer-bottom{text-align:center;font-size:.8rem;color:var(--mute);margin-top:32px;max-width:1100px;margin-left:auto;margin-right:auto;padding:0 clamp(16px,4vw,48px)}
@media(max-width:767px){
  .footer-grid{grid-template-columns:1fr;gap:24px;text-align:center}
}

/* === Back to top === */
.back-top{position:fixed;bottom:32px;right:32px;width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;border:none;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(16px);transition:opacity .3s,transform .3s;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.back-top.visible{opacity:1;transform:none}
.back-top:hover{box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* === Toast === */
.copy-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);padding:12px 20px;background:var(--ink);color:var(--bg);border-radius:8px;font-size:.9rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.15);opacity:0;transition:opacity .2s,transform .2s;z-index:1000}
.copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* === Case study rich content === */
.detail-content figure{margin:24px 0}
.detail-content figure img{width:100%;border-radius:8px;border:1px solid var(--line)}
.detail-content figcaption{font-size:.85rem;color:var(--mute);margin-top:8px;font-style:italic}
.detail-content table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.92rem}
.detail-content th,.detail-content td{padding:10px 14px;border:1px solid var(--line);text-align:left}
.detail-content th{background:var(--card);font-weight:600}
.detail-content .callout{border-left:3px solid var(--acc);padding:12px 16px;margin:16px 0;background:color-mix(in srgb,var(--acc) 5%,var(--card));border-radius:0 8px 8px 0;font-size:.92rem;line-height:1.6}
.detail-content .callout strong{color:var(--acc)}
.detail-content h3{font-size:1.05rem;margin:24px 0 8px}
.detail-content .table-wrap{overflow-x:auto;margin:16px 0;-webkit-overflow-scrolling:touch}

/* === Reduced motion === */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  html{scroll-behavior:auto}
}

/* === Print === */
@media print{
  .nav-wrap,.back-top,#copyToast,#themeToggle,.nav-btn,.case-cta svg,.detail-toc,.project-nav{display:none!important}
  body{color:#000;background:#fff;font-size:12pt}
  .section{padding:24px 0;break-inside:avoid}
  .case-card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  a{color:#000;text-decoration:underline}
}
</style>
</head>

<script>
/* ====== DATA — EDIT HERE ====== */
var ME={
  name:"Anjuman",
  role:"Data Analyst, JPMorganChase",
  intro:"I turn customer and marketing data into decisions: who to target, where to spend, and which step in a journey is losing people. 2+ years in financial analytics, working with risk, cards and marketing teams.",
  email:"anjuman.2002.official@gmail.com",
  github:"https://github.com/mellow-d",
  resume:"Anjuman_Resume_JPMorganChase_2026.pdf",
  skills:[
    {category:"Analysis",items:["Segmentation","Attribution","Funnel analysis","Regression","Forecasting"]},
    {category:"Tools",items:["Python","SQL","PySpark","Databricks","Streamlit"]},
    {category:"Working with",items:["Risk stakeholders","Cards stakeholders","Marketing stakeholders"]}
  ],
  more:[
    {year:"2026",title:"D&A Shark Tank 2026",desc:"Finalist among 150+ submissions for Digital Call Smart Assist, a customer-service concept."},
    {year:"2025",title:"AI Hackathon, Q2 2025",desc:"Top 5 of 350 entries for an AI-based PII detection and protection system."},
    {year:"2026",title:"Innovation Week 2026",desc:"Co-hosted a two-week, org-wide technology event with 2,000+ attendees."}
  ],
  edu:"B.E. Computer Science, RV College of Engineering, Bangalore. CGPA 8.56/10. 2020–2024.",
  interests:"Macroeconomics, especially bond markets. Chess, peak rating 1850."
};

var TEAM_COLORS={Risk:"#e67e22",Cards:"#3b82f6",Marketing:"#8b5cf6","Personal project":"#0b7a5c"};
var TEAM_COLORS_DARK={Risk:"#f5a623",Cards:"#60a5fa",Marketing:"#a78bfa","Personal project":"#4fd1a5"};

var PROJECTS=[
{id:"aml-kyc",title:"Periodic Review Optimization for AML/KYC",team:"Risk",
 metric:"4",metricLabel:"risk tiers",
 outcome:"Reduced periodic review volume with data-driven, per-segment thresholds for tens of millions of customers",
 short:"Replacing one-size-fits-all transaction thresholds with per-segment, tiered review triggers — so compliance effort goes where it matters.",
 stack:["Python","PySpark","SQL","scikit-learn","GMM","K-Means","Decision trees"],
 sections:[
  /* 1. Summary */
  ["Summary",'<p>Banks must periodically re-review every customer for money-laundering risk. At scale — tens of millions of customers — the old approach of one fixed transaction threshold per customer type flagged far too many accounts for manual review. This case study walks through the pipeline I designed and built to replace those thresholds with data-driven, per-segment tiers. You will see how I grouped customers, detected hidden sub-populations, chose between clustering algorithms, turned clusters into explainable business rules, and built a two-condition trigger that filters out noise. The system is going live; results are pending.</p>',true],
  /* 2. Background */
  ["Background for non-experts",'<div class="callout"><strong>AML (Anti-Money Laundering)</strong> is the set of controls banks use to detect and report suspicious financial activity. Regulators require it; failing costs billions in fines.</div><div class="callout"><strong>KYC (Know Your Customer)</strong> is the process of verifying who a customer is — their identity, source of funds, and risk profile — when they open an account and periodically thereafter.</div><div class="callout"><strong>Periodic review (PR)</strong> is the scheduled re-check of a customer\'s risk profile. Instead of waiting for something suspicious to happen, the bank proactively reviews customers on a cycle. The goal is to catch changes — a retail customer who starts moving large sums, or a business whose transaction pattern shifts.</div><p>A <strong>customer type</strong> is a group of customers who share similar KYC attributes: income bracket, business location, products they hold, and their assigned AML risk score. The idea is that customers within a type should behave similarly, so a single threshold can apply to the group. In practice, this assumption breaks down — which is what this project addresses.</p>',true],
  /* 3. The problem */
  ["The problem",'<p>The existing system used <strong>one fixed transaction threshold per customer type</strong>. Any customer whose average monthly transaction exceeded that threshold was flagged for review.</p><p>These thresholds were set years earlier and had not kept pace with how customer behaviour evolved. The AML/KYC team confirmed the old thresholds were set far too low — meaning too many customers cleared the bar and were sent to reviewers. With tens of millions of customers, even a small over-flagging rate produces an enormous review queue.</p><p>There was no numeric reduction target. The goal was to <strong>reduce the number of accounts reviewed in a data-driven, explainable, defensible way</strong> — without weakening the bank\'s compliance posture. Any new thresholds had to be transparent enough for regulators and model-risk teams to audit.</p>',true],
  /* 4. Approach */
  ["Approach",'<figure><img src="figures/fig1_pipeline.png" alt="Pipeline flowchart showing 6 steps from customer grouping to trigger logic" loading="lazy"><figcaption>Figure 1: The six-step pipeline from raw KYC data to review trigger. Each step feeds the next. All data is synthetic and illustrative.</figcaption></figure><h3>Step 1 — Group customers by KYC attributes</h3><p>I started by grouping tens of millions of customers into <strong>customer types</strong> using their KYC attributes: income category, business location, products owned, AML risk score, and others. This mirrors how the compliance team already thinks about customers, so the grouping is auditable.</p><h3>Step 2 — Test each type\'s distribution</h3><p>For each customer type, I plotted the <strong>log of average monthly transaction amount</strong> across all its customers. Then I tested whether the resulting curve was unimodal (one peak, one behaviour pattern) or multimodal (multiple peaks, meaning distinct sub-groups are hiding inside one type).</p><figure><img src="figures/fig2_distributions.png" alt="Side by side comparison of unimodal vs multimodal transaction distributions" loading="lazy"><figcaption>Figure 2: A unimodal type (left) has customers who behave similarly. A multimodal type (right) hides distinct sub-groups — each peak is a different behaviour pattern. Synthetic data.</figcaption></figure><h3>Step 3 — Cluster the multimodal types</h3><p>For types that tested as multimodal, I needed to find the sub-groups. I fitted both <strong>Gaussian Mixture Models (GMM)</strong> and <strong>K-Means clustering</strong> on multiple features and compared the results. For each type, I chose whichever algorithm produced sub-types whose log-transaction curves were cleaner and more unimodal. (More on this decision in the next section.)</p><h3>Step 4 — Decision-tree rules for explainability</h3><p>Clustering algorithms assign labels, but they cannot explain <em>why</em> a customer ended up in a particular sub-type. I fitted a decision tree on the cluster labels. The tree\'s splits became explicit business rules — "if income category is X and AML risk score is above Y, assign sub-type 3." This means a reviewer can see exactly which conditions placed a customer in their segment, without running a model.</p><h3>Step 5 — Compute tier thresholds</h3><p>After the log transform, the distributions were roughly symmetric. I normalized them and set four tiers per type or sub-type, based on the distribution\'s own statistics — not arbitrary cutoffs.</p><h3>Step 6 — Tier-up + X% trigger</h3><p>A customer is flagged only if <strong>both</strong> conditions are met: they moved up at least one tier <strong>and</strong> their average monthly transaction changed by more than X% since their last review. The combined condition acts as hysteresis — it filters out month-to-month noise near tier boundaries. X is set per customer type.</p>',true],
  /* 5. Design decisions */
  ["Design decisions",'<h3>Handling multimodality</h3><p>Why not just set wider thresholds for multimodal types? Because a single bell curve fitted to a multi-peaked distribution places its mean between the peaks — exactly where few customers actually are. Thresholds based on that mean are neither sensitive for the low-transaction sub-group nor appropriate for the high-transaction one. Splitting into sub-types lets each group get a threshold matched to its own behaviour.</p><figure><img src="figures/fig3_gmm_vs_kmeans.png" alt="GMM produces cleaner unimodal sub-curves compared to K-Means hard boundaries" loading="lazy"><figcaption>Figure 3: GMM (left) splits the multimodal distribution into sub-types that are each unimodal. K-Means (right) uses hard boundaries that can cut through a peak, leaving messy sub-curves. I picked the cleaner split per type. Synthetic data.</figcaption></figure><h3>GMM vs K-Means — why not always GMM?</h3><p>GMM is a soft-assignment model: it estimates probability of membership per cluster, which often follows the natural shape of the data better. K-Means uses hard Euclidean boundaries. In most cases GMM produced cleaner unimodal sub-type curves on the target variable, but not always — some types had compact, well-separated clusters where K-Means performed equally well or better. I evaluated both per type and kept whichever gave more unimodal sub-curves.</p><h3>Decision-tree rules for explainability</h3><p>Regulators and model-risk reviewers need to understand <em>why</em> a customer was assigned to a segment. A GMM or K-Means label is a black box — "cluster 3" means nothing to a reviewer. By fitting a decision tree on the cluster labels, I converted each clustering into a set of if/then rules that use the original KYC attributes. The slight loss in boundary precision is worth the gain in auditability.</p><h3>The tier system</h3><div class="table-wrap"><table><thead><tr><th>Tier</th><th>Range</th><th>Interpretation</th></tr></thead><tbody><tr><td>Low</td><td>0 &lt; x ≤ mean − σ</td><td>Transactions well below the group average</td></tr><tr><td>Medium</td><td>mean − σ &lt; x ≤ mean + σ</td><td>Typical behaviour for this group</td></tr><tr><td>Elevated</td><td>mean + σ &lt; x ≤ high percentile (e.g. 99th)</td><td>Noticeably above average</td></tr><tr><td>High</td><td>Above high percentile, up to max</td><td>Extreme outlier for this group</td></tr></tbody></table></div><figure><img src="figures/fig4_tiers.png" alt="Distribution with four tier brackets marked at mean minus sigma, mean plus sigma, and high percentile" loading="lazy"><figcaption>Figure 4: The four tiers overlaid on a customer type\'s distribution. Boundaries are derived from the group\'s own statistics. Synthetic data.</figcaption></figure><h3>The tier-up + X% trigger as hysteresis</h3><p>If a customer\'s transaction amount hovers near a tier boundary, small month-to-month fluctuations could push them back and forth — generating a review every cycle for what is really just noise. The <strong>X% change requirement</strong> acts as hysteresis: the customer must not only cross a tier boundary but also show a material change in transaction volume compared to their last review. This second condition suppresses noise without weakening the signal.</p><h3>How X was chosen</h3><p>I set X per customer type by analysing how the rate of customer movement changed as X varied. At low values of X, many customers are flagged (most will have <em>some</em> change). As X increases, the rate drops. At some point, raising X further barely reduces the flagging rate — the curve flattens. I chose the X at that stabilization point.</p><div class="callout"><strong>Honest note:</strong> This is a stability-based criterion, not a risk-based one. It finds the point where noise is filtered out, but it does not optimise against any measure of actual suspiciousness. A risk-calibrated X would require labelled outcomes, which this pipeline does not have.</div><figure><img src="figures/fig5_threshold_x.png" alt="Line chart showing flagging rate decreasing as X increases, with stabilization point marked" loading="lazy"><figcaption>Figure 5: The flagging rate drops steeply at first, then stabilises. The chosen X sits at the elbow. Synthetic data.</figcaption></figure>',true],
  /* 6. Engineering */
  ["Engineering and architecture",'<p>The pipeline runs on <strong>PySpark</strong> for data processing and <strong>SQL</strong> for upstream queries. Clustering models (GMM or K-Means, one per customer type) are trained with scikit-learn and serialised. At runtime, the architecture loads each customer type\'s trained model to assign sub-types, then looks up the corresponding tier thresholds.</p><h3>Threshold storage</h3><p>Thresholds are stored as <strong>Parquet files</strong> — one per customer type — keyed by sub-type and tier boundary. Parquet was chosen over a database table for three reasons: it is columnar and fast for the lookup pattern (read a few rows by type), it is versioned alongside the pipeline code, and it does not require a separate database dependency in the scoring path.</p><h3>Scaling</h3><p>The grouping, distribution testing, and threshold computation all run as Spark jobs. The clustering step runs per customer type, so it parallelises naturally. The decision-tree rule extraction runs once per type after clustering and is cheap. The scoring path — assign sub-type, look up tier, check trigger — runs per customer and is stateless, so it scales linearly.</p><p>The workflow re-runs whenever a customer\'s KYC attributes change. Customers with no KYC change are covered by separate transaction-based AML monitoring models that sit outside this project.</p>',true],
  /* 7. Rollout & validation */
  ["Rollout and validation plan",'<p>The system is <strong>going live</strong>. Results are not yet available.</p><figure><img src="figures/fig6_funnel.png" alt="Funnel showing all customers narrowing through tier-up and X percent change filters to manual review" loading="lazy"><figcaption>Figure 6: The review funnel. Each filter reduces the population sent to manual review. Proportions are illustrative. Synthetic data.</figcaption></figure><h3>Planned measurements</h3><ul><li><strong>Review volume:</strong> replay the last review cycle under the new thresholds and compare the count of flagged accounts to the old system. [PLACEHOLDER — number pending]</li><li><strong>Recall against known cases:</strong> check whether customers who previously filed suspicious activity reports (SARs) would still be flagged. [PLACEHOLDER — number pending]</li><li><strong>Reviewer time:</strong> measure average time per review before and after, to see if the smaller queue lets reviewers spend more time per case. [PLACEHOLDER — number pending]</li><li><strong>Defined success metric:</strong> to be agreed with the AML/KYC team and model-risk review. [PLACEHOLDER]</li></ul><div class="callout"><strong>Attempted validation:</strong> I compared the log-average-monthly-transaction curves for customers who had filed SARs against others. The curves overlapped substantially, so this check was inconclusive. It does not validate or invalidate the tier system — it simply means this particular variable does not separate SAR-filers from the rest on its own.</div>',true],
  /* 8. Limitations */
  ["Limitations and next steps",'<ul><li><strong>Single-variable tiers.</strong> The tier system relies on one variable — average monthly transaction — because it was the target variable for periodic review. A multi-variable tier system could capture more dimensions of behaviour change, but would be harder to explain to reviewers and regulators.</li><li><strong>No ground truth.</strong> There is no labelled dataset of "truly risky" customers in this pipeline. The system is a prioritisation method, not a detection system. It relies on other AML controls — transaction monitoring models, sanctions screening, and manual investigation — for behavioural detection.</li><li><strong>Stability-based X, not risk-based.</strong> The threshold X is chosen where the flagging rate stabilises, which is a statistical criterion. A risk-calibrated threshold would require labelled outcomes that do not exist in this context.</li><li><strong>SAR comparison was inconclusive.</strong> As noted above, comparing SAR-filers to non-filers on this variable did not yield a usable signal.</li></ul><h3>What I would do next</h3><ul><li>Define a formal success metric with the model-risk team before the first review cycle completes.</li><li>Build a feedback loop: track which flagged customers actually lead to SARs or enhanced due diligence, and use that to recalibrate tiers.</li><li>Explore multi-variable tier boundaries if the single-variable approach proves too coarse after the first cycle.</li><li>Automate threshold refresh on a schedule, rather than only when KYC attributes change.</li></ul>',true],
  /* 9. Tech stack & role */
  ["Tech stack and my role",'<div class="table-wrap"><table><thead><tr><th>Layer</th><th>Technology</th></tr></thead><tbody><tr><td>Data processing</td><td>PySpark, SQL</td></tr><tr><td>Clustering</td><td>scikit-learn (GMM, K-Means)</td></tr><tr><td>Explainability</td><td>Decision trees (scikit-learn)</td></tr><tr><td>Threshold storage</td><td>Parquet files</td></tr><tr><td>Runtime scoring</td><td>PySpark + model loading</td></tr></tbody></table></div><p>The project was built end to end by a team of three. I owned the design and implementation of the full pipeline: analysis, clustering, rules, thresholds, and the runtime architecture.</p>',true]
 ]},

function applyTheme(t){

/* Scroll reveal */
function initReveal(){
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){e.target.classList.add('revealed');io.unobserve(e.target);}
    });
  },{threshold:.1,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach(function(el){io.observe(el)});
}

/* Animated counters */
function initCounters(){
  var done=false;
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting&&!done){
        done=true;
        document.querySelectorAll('.stat .big').forEach(function(el){
          var text=el.textContent;
          var match=text.match(/^([\d.]+)(.*)$/);
          if(!match){return;}
          var target=parseFloat(match[1]);
          var suffix=match[2];
          var isFloat=match[1].indexOf('.')!==-1;
          var start=performance.now();
          var dur=1400;
          (function tick(now){
            var p=Math.min((now-start)/dur,1);
            var ease=1-Math.pow(1-p,3);
            var v=target*ease;
            el.textContent=(isFloat?v.toFixed(2):Math.round(v))+suffix;
            if(p<1) requestAnimationFrame(tick);
          })(start);
        });
        io.unobserve(e.target);
      }
    });
  },{threshold:.3});
  var s=document.querySelector('.stats');
  if(s) io.observe(s);
}

      '<h2 class="reveal">Selected work</h2>'+
      '<div class="case-list">'+cards+'</div>'+
    '</div></section>'+

    '<section class="section"><div class="section-inner reveal">'+
      '<h2>Skills</h2>'+renderSkills()+
    '</div></section>'+

    '<section class="section"><div class="section-inner reveal">'+
      '<h2>Recognition</h2>'+renderTimeline(ME.more)+
    '</div></section>'+

    '<section class="section"><div class="section-inner">'+
      '<div class="reveal"><h2>Education</h2><p>'+esc(ME.edu)+'</p></div>'+
      '<div class="reveal" style="margin-top:32px"><h2>Outside work</h2><p>'+esc(ME.interests)+'</p></div>'+
    '</div></section>'+

    footerHTML();

  window.scrollTo(0,0);
  initReveal();initCounters();initSkillFilter();renderLastUpdated();
  document.getElementById('main')||document.querySelector('section').setAttribute('id','main');
}

/* ====== PROJECT DETAIL ====== */
function project(id){
  var idx=PROJECTS.findIndex(function(x){return x.id===id});
  if(idx===-1){location.hash='#/';return}
  var p=PROJECTS[idx];
  var tc=getTeamColor(p.team);
  document.title=p.title+' — '+ME.name;
  renderNav();

  /* TOC */
  var tocItems=p.sections.map(function(s,i){
    var sid='sec-'+i;
    return '<li'+(i===0?' class="active"':'')+'><a href="#'+sid+'">'+esc(s[0])+'</a></li>';
  }).join('');

  /* Content */
  var content=p.sections.map(function(s,i){
    var sid='sec-'+i;
    var body;
    if(s[2]){body=s[1]}
    else if(Array.isArray(s[1])){body='<ul>'+s[1].map(function(li){return '<li>'+esc(li)+'</li>'}).join('')+'</ul>'}
    else{body='<p>'+esc(s[1])+'</p>'}
    return '<div class="reveal" style="--i:'+i+'"><h2 id="'+sid+'">'+esc(s[0])+'</h2>'+body+'</div>';
  }).join('');

  /* Prev / Next */
  var prevIdx=(idx-1+PROJECTS.length)%PROJECTS.length;
  var nextIdx=(idx+1)%PROJECTS.length;
  var prev=PROJECTS[prevIdx];
  var next=PROJECTS[nextIdx];
  var prevColor=getTeamColor(prev.team);
  var nextColor=getTeamColor(next.team);
  var navHTML='<div class="project-nav">'+
    '<a href="#/project/'+prev.id+'"><div class="nav-label">← Previous</div><div class="nav-title">'+esc(prev.title)+'</div><div class="nav-team" style="color:'+prevColor+'">'+esc(prev.team)+'</div></a>'+
    '<a href="#/project/'+next.id+'" class="next"><div class="nav-label">Next →</div><div class="nav-title">'+esc(next.title)+'</div><div class="nav-team" style="color:'+nextColor+'">'+esc(next.team)+'</div></a>'+
  '</div>';

  /* Tags */
  var tagsHTML='<div class="tags">'+[p.team].concat(p.stack).map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>';

  app.innerHTML=
    '<div class="detail-header" style="--team-color:'+tc+'"><div class="section-inner">'+
      '<a class="back" href="#/">'+BACK_SVG+' Back to all work</a>'+
      '<h1>'+esc(p.title)+'</h1>'+
      '<p class="lede" style="margin-top:12px">'+esc(p.short)+'</p>'+
      '<div class="detail-meta">'+
        '<span class="detail-metric">'+esc(p.metric)+' '+esc(p.metricLabel)+'</span>'+
        '<span class="detail-team" style="--team-color:'+tc+';color:'+tc+';border-color:'+tc+'">'+esc(p.team)+'</span>'+
      '</div>'+
      tagsHTML+
    '</div></div>'+

    '<div class="detail-layout" id="main">'+
      '<aside class="detail-toc" aria-label="Table of contents"><ul>'+tocItems+'</ul></aside>'+
      '<div class="detail-content">'+content+navHTML+'</div>'+
    '</div>'+

    footerHTML();

  window.scrollTo(0,0);
  initReveal();renderLastUpdated();
  initScrollspy();
}

/* Scrollspy for TOC */
function initScrollspy(){
  var toc=document.querySelector('.detail-toc');
  if(!toc) return;
  var headings=document.querySelectorAll('.detail-content h2[id]');
  if(!headings.length) return;
  var items=toc.querySelectorAll('li');
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        var id=e.target.id;
        items.forEach(function(li){
          var link=li.querySelector('a');
          li.classList.toggle('active',link&&link.getAttribute('href')==='#'+id);
        });
      }
    });
  },{rootMargin:'-20% 0px -60% 0px'});
  headings.forEach(function(h){io.observe(h)});
}

/* Page transitions */
var _transitioning=false;
function route(){
  var hash=location.hash;
  var m=hash.match(/^#\/project\/([\w-]+)/);

  if(!_transitioning&&app.innerHTML){
    _transitioning=true;
    app.style.opacity='0';
    app.style.transition='opacity .15s ease';
    setTimeout(function(){
      if(m) project(m[1]); else home();
      app.style.opacity='1';
      setTimeout(function(){
        app.style.transition='';
        _transitioning=false;
      },150);
    },150);
  } else {
    _transitioning=false;
    if(m) project(m[1]); else home();
  }
}
window.addEventListener('hashchange',route);
route();
</script>
